name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security-grade:
    name: Security Grade
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Test security grade validator
        run: npm run security:test

      - name: Validate A-grade deployment headers
        run: npm run security:headers

  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: crescebr
          POSTGRES_PASSWORD: crescebr
          POSTGRES_DB: crescebr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://crescebr:crescebr@localhost:5432/crescebr_test
      JWT_SECRET: ci-test-secret
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      # `.npmrc` sets `ignore-scripts=true` (supply-chain hardening), which skips
      # sqlite3's native build during `npm ci`. The backend test suite uses an
      # in-memory SQLite database via Sequelize, so rebuild just that one native
      # module with scripts enabled.
      - name: Build sqlite3 native binding
        run: npm run setup:native

      - name: Build shared types
        run: npm run shared:build

      - name: Lint backend
        working-directory: backend
        run: npm run lint

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage/

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build shared types
        run: npm run shared:build

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/

  e2e:
    name: End-to-End
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # globalSetup probes both ports before Playwright starts anything, so both
    # services must exist even though the rate limiter would otherwise fall back
    # to its in-memory stand-in.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: crescebr
          POSTGRES_DB: crescebr_test
          # No POSTGRES_PASSWORD. Service-container env cannot be computed —
          # nothing runs before services start — so a password here would have
          # to be a literal committed to the tree. This container is reachable
          # only from inside this job and is destroyed with it, so trust auth
          # removes the credential instead of hiding it.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # NODE_ENV=test makes config.cjs use its `test` entry (TEST_DB_NAME) and
      # database.ts target crescebr_test, so the CLI and the server agree on the
      # database the postgres service actually created.
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: crescebr
      DB_NAME: crescebr_test
      TEST_DB_NAME: crescebr_test
      REDIS_URL: redis://localhost:6379
      # DB_PASSWORD and JWT_SECRET are generated per run by the step below
      # rather than committed here.
      # The suite signs in about ten times per run through the real login form.
      # authRateLimit allows 5 per 15 minutes for any NODE_ENV outside
      # development/production, so without this the run dies on the sixth
      # sign-in and the 429 reads as a broken login.
      AUTH_RATE_LIMIT_MAX: '500'

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      # Generated, not committed. config.cjs throws on an unset DB_PASSWORD by
      # design, and postgres ignores it under trust auth, so a fresh random
      # value satisfies both without putting a credential in the repository.
      # A per-run JWT secret is better practice than a shared constant anyway.
      - name: Generate throwaway credentials
        run: |
          echo "DB_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build shared types
        run: npm run shared:build

      # `.npmrc` sets `ignore-scripts=true`, so Playwright's postinstall never
      # downloads a browser. Only chromium is needed: both projects in
      # playwright.config.ts are chromium-based (Desktop Chrome and Pixel 7).
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Not `npm run e2e` — that wraps `docker compose up` for postgres and
      # redis, which the service containers above already provide. Playwright's
      # own webServer starts the API and the frontend, and `npm run backend:dev`
      # migrates and seeds before the server comes up.
      - name: Run end-to-end tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
