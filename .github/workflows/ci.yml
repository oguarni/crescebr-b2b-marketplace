name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security-grade:
    name: Security Grade
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Test security grade validator
        run: npm run security:test

      - name: Validate A-grade deployment headers
        run: npm run security:headers

  backend:
    name: Backend
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-secret
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      # `.npmrc` sets `ignore-scripts=true` (supply-chain hardening), which skips
      # sqlite3's native build during `npm ci`. The backend test suite uses an
      # in-memory SQLite database via Sequelize, so rebuild just that one native
      # module with scripts enabled.
      - name: Build sqlite3 native binding
        run: npm run setup:native

      - name: Build shared types
        run: npm run shared:build

      - name: Lint backend
        working-directory: backend
        run: npm run lint

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage/

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build shared types
        run: npm run shared:build

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Type-check frontend and Vite config
        run: npm run typecheck -w frontend

      - name: Test workspace tooling
        run: npm run test:tooling

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      # Deploy Hosting publishes exactly this build, so the one job that can
      # obtain a Google credential never installs or runs project dependencies.
      - name: Upload hosting build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: hosting-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/

  e2e:
    name: End-to-End
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # globalSetup probes both ports before Playwright starts anything, so both
    # services must exist even though the rate limiter would otherwise fall back
    # to its in-memory stand-in.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: crescebr
          POSTGRES_DB: crescebr_test
          # No POSTGRES_PASSWORD. Service-container env cannot be computed —
          # nothing runs before services start — so a password here would have
          # to be a literal committed to the tree. This container is reachable
          # only from inside this job and is destroyed with it, so trust auth
          # removes the credential instead of hiding it.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # NODE_ENV=test makes config.cjs use its `test` entry (TEST_DB_NAME) and
      # database.ts target crescebr_test, so the CLI and the server agree on the
      # database the postgres service actually created.
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: crescebr
      DB_NAME: crescebr_test
      TEST_DB_NAME: crescebr_test
      REDIS_URL: redis://localhost:6379
      # DB_PASSWORD and JWT_SECRET are generated per run by the step below
      # rather than committed here.
      # The suite signs in about ten times per run through the real login form.
      # authRateLimit allows 5 per 15 minutes for any NODE_ENV outside
      # development/production, so without this the run dies on the sixth
      # sign-in and the 429 reads as a broken login.
      AUTH_RATE_LIMIT_MAX: '500'

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      # Generated, not committed. config.cjs throws on an unset DB_PASSWORD by
      # design, and postgres ignores it under trust auth, so a fresh random
      # value satisfies both without putting a credential in the repository.
      # A per-run JWT secret is better practice than a shared constant anyway.
      - name: Generate throwaway credentials
        run: |
          echo "DB_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build shared types
        run: npm run shared:build

      # `.npmrc` sets `ignore-scripts=true`, so Playwright's postinstall never
      # downloads a browser. Only chromium is needed: both projects in
      # playwright.config.ts are chromium-based (Desktop Chrome and Pixel 7).
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Not `npm run e2e` — that wraps `docker compose up` for postgres and
      # redis, which the service containers above already provide. Playwright's
      # own webServer starts the API and the frontend, and `npm run backend:dev`
      # migrates and seeds before the server comes up.
      - name: Run end-to-end tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Merging to main publishes the site. The release waits for every job above,
  # so a red main is never deployed.
  #
  # Runs finish their checks in any order, so an older push that finishes last
  # would overwrite a newer release. Only the run for the tip of main goes on to
  # deploy; a stale run stops here, green, and records no deployment.
  deploy-gate:
    name: Deploy Gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [security-grade, backend, frontend, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      current: ${{ steps.tip.outputs.current }}

    steps:
      - name: Check this is still the tip of main
        id: tip
        run: |
          tip=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)
          test -n "$tip"
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main is now at $tip; the run for that commit deploys it."
          fi

  # The live grade is checked against the new release instead of racing it.
  deploy:
    name: Deploy Hosting
    needs: deploy-gate
    if: needs.deploy-gate.outputs.current == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://crescebr.com.br
    # One release at a time, never cut off mid-upload. A run passes the gate
    # minutes before any newer push can finish its checks, so runs arrive here
    # in push order: when a newer run replaces a waiting older one, the newer
    # commit still deploys last.
    concurrency:
      group: firebase-hosting-production
      cancel-in-progress: false
    # Keyless. Workload Identity Federation trades this job's OIDC token for a
    # short-lived token of a Hosting-only service account, and the provider
    # accepts only this job's claims (scripts/setup-hosting-deploy.sh).
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Download hosting build
        uses: actions/download-artifact@v7
        with:
          name: hosting-dist
          path: frontend/dist

      # The standalone CLI bundles its dependencies, so its checksum pins every
      # line of code that runs with the deploy credential. `npx` would resolve
      # firebase-tools' dependency ranges afresh on each run.
      - name: Install Firebase CLI
        env:
          FIREBASE_TOOLS_VERSION: 15.34.0
          FIREBASE_TOOLS_SHA256: e6e271a8050b70f92725e4349faf9a586ff12e1d4b57deb751e86211a107f644
        run: |
          curl -fsSL -o "$RUNNER_TEMP/firebase" \
            "https://github.com/firebase/firebase-tools/releases/download/v${FIREBASE_TOOLS_VERSION}/firebase-tools-linux"
          echo "${FIREBASE_TOOLS_SHA256}  $RUNNER_TEMP/firebase" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/firebase"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-hosting-deploy@crescebr-portfolio-9048.iam.gserviceaccount.com

      - name: Deploy to Firebase Hosting
        run: >-
          "$RUNNER_TEMP/firebase" deploy --only hosting
          --project crescebr-portfolio-9048 --non-interactive
          --message "main $GITHUB_SHA"

      - name: Require live grade A or better
        run: npm run security:grade
