version: 2

updates:
  # npm workspaces: the root manifest covers frontend, backend and shared.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    # Grouped so a week of updates is one reviewable PR, not twenty rubber stamps.
    # Security advisories are always opened separately by Dependabot.
    groups:
      # The @vitest/* packages peer-depend on the exact vitest version, so even
      # a patch has to move them together. These two groups come first because
      # a dependency joins the first group it matches.
      vitest:
        patterns: ['vitest', '@vitest/*']
      # @mui/icons-material and @mui/lab follow @mui/material's version line.
      mui:
        patterns: ['@mui/*']
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # @vitejs/plugin-react 6 requires vite ^8; this repo is on vite ^7.
      # Taking it means a Vite 7 -> 8 major migration, which is its own piece
      # of work and must not ride in on a dev-dependency bump (see #44, where
      # it broke the build with ERR_PACKAGE_PATH_NOT_EXPORTED for 'vite/internal').
      # 5.2.0 already spans vite ^7 and ^8, so nothing is lost by waiting.
      # Drop this entry as part of the Vite 8 migration, not before.
      - dependency-name: '@vitejs/plugin-react'
        update-types: [version-update:semver-major]
      # @types/node majors follow the Node runtime, which is still node:20 in
      # both images, and the types are already on 24. A newer major, like the
      # 26 offered in #54, lets code type-check against APIs that production
      # does not have. Raise it together with the runtime upgrade.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # The same holds for Vite, Vitest and MUI majors. Each one is a migration,
      # and Dependabot offers them in pieces that cannot pass CI: vite 8 alone
      # broke the build (#75, manualChunks is not a function) and needs
      # plugin-react 6 above; the vitest group still split Vitest 5 into #74
      # (vitest only, npm ci crashed) and #76 (coverage-v8 only, ERESOLVE); and
      # @mui/icons-material 9 requires @mui/material ^9.4.0 (#69, 13 Navbar
      # tests failed on Material 7). Left open, those PRs held four of the five
      # open-PR slots and blocked the minor and patch groups. Drop each entry as
      # part of its migration.
      - dependency-name: 'vite'
        update-types: [version-update:semver-major]
      - dependency-name: 'vitest'
        update-types: [version-update:semver-major]
      - dependency-name: '@vitest/*'
        update-types: [version-update:semver-major]
      - dependency-name: '@mui/*'
        update-types: [version-update:semver-major]
      # These majors wait for the environment, not for a migration, and CI
      # cannot catch either problem. concurrently 10 (#80) declares Node >=22
      # and lint-staged 17 (#81) Node >=22.22.1, while the images, CI and local
      # development are on Node 20. Both still start on Node 20, with only an
      # EBADENGINE warning, but that is outside what they support and any later
      # release may rely on Node 22. Like @types/node, they follow the runtime.
      # sqlite3 6 (#79) ships a prebuilt binary that needs glibc 2.38, so on
      # Ubuntu 22.04 (glibc 2.35) the backend tests cannot load it, while CI on
      # ubuntu-latest stays green. Raise it with the development host.
      - dependency-name: 'concurrently'
        update-types: [version-update:semver-major]
      - dependency-name: 'lint-staged'
        update-types: [version-update:semver-major]
      - dependency-name: 'sqlite3'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(ci)
